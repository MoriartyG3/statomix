[project]
name = "statomix"
version = "0.1.0"
description = "Statistical analysis toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fileverse17",
    "lifelines>=0.30.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
packages = ["statomix"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.uv.sources]
fileverse17 = { git = "ssh://git@github.com/MoriartyG3/fileverse17.git" }
