[project]
name = "statomix"
version = "0.3.0"
description = "Modular human-in-the-loop statistical analysis workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fileverse17",
    "great-tables>=0.23.0",
    "lifelines>=0.30.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=2.3.3,<3.0",
    "pyarrow>=25.0.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
]

[project.scripts]
statomix-compare = "statomix.testing.parity:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
fileverse17 = { git = "https://github.com/MoriartyG3/fileverse17.git", rev = "a5af758d8a8f3accefe3726307466ed85607e9b5" }

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"src/statomix/analytics/**/*.py" = ["F401"]
"src/statomix/dataset/**/*.py" = ["F401"]
"src/statomix/pipelines/**/*.py" = ["F401"]
"src/statomix/project/**/*.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
