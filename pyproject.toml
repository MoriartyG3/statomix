[project]
name = "statomix"
version = "0.1.0"
description = "Statistical analysis toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fileverse17",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.uv.sources]
fileverse17 = { git = "ssh://git@github.com/MoriartyG3/fileverse17.git" }
